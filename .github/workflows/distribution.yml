name: Distribution
# The only merge gate: branch protection requires the `ci` job below on main. A branch's commits run once, through
# their pull request, so each commit carries one `ci` result.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read  # every job's token reads the repository and nothing more; no job here uses a secret
jobs:
  consumers:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
        include:
          # The CLI's floor, which README.md promises: Python 3.9, as Apple ships it at /usr/bin/python3.
          - os: macos-latest
            python: apple
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python != 'apple'
        with:
          python-version: ${{ matrix.python }}
      - name: Apple's /usr/bin/python3 as python3
        if: matrix.python == 'apple'
        run: |
          /usr/bin/python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 9), "Apple no longer ships Python 3.9: the floor this job checks has moved"'
          mkdir -p "$RUNNER_TEMP/apple-python"
          printf '#!/bin/sh\nexec /usr/bin/python3 "$@"\n' > "$RUNNER_TEMP/apple-python/python3"
          chmod +x "$RUNNER_TEMP/apple-python/python3"
          echo "$RUNNER_TEMP/apple-python" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n packages/curl/install.sh
      - run: node --check packages/npm/bin/slopcheck.js
      - run: python3 -m compileall -q cli scripts

  email-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/email-in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/email-in/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx --no-install wrangler deploy --dry-run --outdir /tmp/email-worker-bundle

  ci:
    # The one check branch protection requires on main: it runs after every other job, even when one fails, and passes
    # only when all of them passed, so the matrix can change without touching the repository's settings.
    if: always()
    needs: [consumers, email-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.consumers.result }}" = success && test "${{ needs.email-worker.result }}" = success
